juju:
  model-defaults:
    logging-config: <root>=INFO; unit=DEBUG
providers:
  lxd:
    enable: true
    bootstrap: true
host:
  snaps:
    jhack:
      channel: latest/edge
      connections:
        - jhack:dot-local-share-juju snapd
    # S3-compatible backend for the backup integration tests.
    microceph:
      channel: squid/stable
    # Azure Blob emulator for the backup integration tests. Here rather than in
    # the fixture so the download lands in `concierge prepare`, not in the job's
    # test budget.
    azurite:
      channel: latest/edge
