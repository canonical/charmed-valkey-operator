project: valkey-operator

backends:
  # Derived from https://github.com/jnsgruk/zinc-k8s-operator/blob/a21eae8399eb3b9df4ddb934b837af25ef831976/spread.yaml#L11
  lxd-vm:
    # TODO: remove after https://github.com/canonical/spread/pull/185 merged & in charmcraft
    type: adhoc
    allocate: |
      hash=$(python3 -c "import hashlib; print(hashlib.sha256('$SPREAD_PASSWORD'.encode()).hexdigest()[:6])")
      VM_NAME="${VM_NAME:-${SPREAD_SYSTEM//./-}-${hash}}"
      DISK="${DISK:-25}"
      CPU="${CPU:-4}"
      MEM="${MEM:-8}"

      cloud_config="#cloud-config
      ssh_pwauth: true
      users:
        - default
        - name: runner
          plain_text_passwd: $SPREAD_PASSWORD
          lock_passwd: false
          sudo: ALL=(ALL) NOPASSWD:ALL
      "

      lxc launch --vm \
        "${SPREAD_SYSTEM//-/:}" \
        "${VM_NAME}" \
        -c user.user-data="${cloud_config}" \
        -c limits.cpu="${CPU}" \
        -c limits.memory="${MEM}GiB" \
        -d root,size="${DISK}GiB"

      # Wait for the runner user
      while ! lxc exec "${VM_NAME}" -- id -u runner &>/dev/null; do sleep 0.5; done

      # Set the instance address for spread
      ADDRESS "$(lxc ls -f csv | grep "${VM_NAME}" | cut -d"," -f3 | cut -d" " -f1)"
    discard: |
      hash=$(python3 -c "import hashlib; print(hashlib.sha256('$SPREAD_PASSWORD'.encode()).hexdigest()[:6])")
      VM_NAME="${VM_NAME:-${SPREAD_SYSTEM//./-}-${hash}}"
      lxc delete --force "${VM_NAME}"
    environment:
      CONCIERGE_EXTRA_SNAPS: charmcraft
      CONCIERGE_EXTRA_DEBS: pipx
    systems:
      - ubuntu-24.04:
          username: runner
    prepare: |
      systemctl disable --now unattended-upgrades.service
      systemctl mask unattended-upgrades.service
      pipx install charmcraftcache
      cd "$SPREAD_PATH"
      charmcraftcache pack -v
    restore-each: |
      cd "$SPREAD_PATH"
      # Revert python-libjuju version override
      git restore pyproject.toml poetry.lock

      # Use instead of `concierge restore` to save time between tests
      # For example, with microk8s, using `concierge restore` takes twice as long as this (e.g. 6
      # min instead of 3 min between every spread job)
      juju destroy-model --force --no-wait --destroy-storage --no-prompt concierge-k8s:testing
      juju destroy-model --force --no-wait --destroy-storage --no-prompt concierge-vm:testing
      juju kill-controller --no-prompt concierge-k8s
      juju kill-controller --no-prompt concierge-vm
    restore: |
      rm -rf "$SPREAD_PATH"

  github-ci:
    type: adhoc
    # Only run on CI
    manual: true
    # HACK: spread requires runners to be accessible via SSH
    # Configure local sshd & instruct spread to connect to the same machine spread is running on
    # (spread cannot provision GitHub Actions runners, so we provision a GitHub Actions runner for
    # each spread job & select a single job when running spread)
    # Derived from https://github.com/jnsgruk/zinc-k8s-operator/blob/a21eae8399eb3b9df4ddb934b837af25ef831976/spread.yaml#L47
    allocate: |
      sudo tee /etc/ssh/sshd_config.d/10-spread-github-ci.conf << 'EOF'
      PasswordAuthentication yes
      PermitEmptyPasswords yes
      EOF

      sudo systemctl daemon-reload
      sudo systemctl start ssh

      sudo passwd --delete runner

      ADDRESS localhost
    # HACK: spread does not pass environment variables set on runner
    # Manually pass specific environment variables
    environment:
      CI: "$(HOST: echo $CI)"
      CHARM_UBUNTU_BASE: "$(HOST: echo $CHARM_UBUNTU_BASE)"
      # To install pipx on self-hosted runners
      CONCIERGE_EXTRA_DEBS: pipx
      DOCKERHUB_MIRROR: "$(HOST: echo $DOCKERHUB_MIRROR)"
      # Service-account key for the real-GCS backup module. Must be base64 JSON:
      # spread exports host values in unescaped double quotes.
      GCS_SERVICE_ACCOUNT: "$(HOST: echo $GCS_SERVICE_ACCOUNT)"
    systems:
      - ubuntu-24.04:
          username: runner

suites:
  tests/spread/k8s/:
    summary: Integration tests for K8s
  tests/spread/vm/:
    summary: Integration tests for VM

path: /root/spread_project

kill-timeout: 3h
environment:
  PATH: $PATH:$(pipx environment --value PIPX_BIN_DIR)
  CONCIERGE_JUJU_CHANNEL: 3.6/stable
prepare: |
  snap refresh --hold
  chown -R root:root "$SPREAD_PATH"
  cd "$SPREAD_PATH"
  snap install --classic concierge

  # Install charmcraft & pipx (on lxd-vm backend)
  if [[ $SPREAD_SUITE == *"vm"* ]]
  then
    concierge prepare --trace -c concierge-vm.yaml
  fi

  if [[ $SPREAD_SUITE == *"k8s"* ]]
  then
    # Canonical K8s defaults its pod CIDR to 10.1.0.0/16 — the same range the GitHub-hosted
    # Azure runners use for their host network, so a pod handed the subnet gateway address
    # cannot reach the apiserver and its first hook dies. concierge has no pod-cidr option,
    # but it adopts an already-clustered node, so bootstrap here first with a safe CIDR.
    POD_CIDR="10.42.0.0/16"

    # Traefik fronts the LDAP tests and stays blocked until its Service gets an address, so the
    # cluster needs a LoadBalancer provider. The range matches the metallb one the microk8s
    # fallback in tests/integration/conftest.py enables, so both environments hand out the same
    # addresses. Announced over L2 on every interface, which is what a single-node cluster needs.
    LB_RANGE="10.64.140.43-10.64.140.49"

    # Fail loudly rather than re-introducing the flake if this ever collides again
    NODE_IP="$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i <= NF; i++) if ($i == "src") {print $(i + 1); exit}}')"
    if [[ ${NODE_IP%.*.*} == "${POD_CIDR%%.0.0/*}" ]]
    then
      echo "pod CIDR $POD_CIDR contains this runner's own address $NODE_IP; pick another" >&2
      exit 1
    fi
    LB_RANGE_START="${LB_RANGE%%-*}"
    if [[ ${NODE_IP%.*} == "${LB_RANGE_START%.*}" ]]
    then
      echo "load-balancer range $LB_RANGE contains this runner's own address $NODE_IP; pick another" >&2
      exit 1
    fi

    if ! k8s status >/dev/null 2>&1
    then
      # Read the channel from concierge-k8s.yaml so the two cannot drift apart
      K8S_CHANNEL="$(awk '/^ *k8s:/ {f = 1} f && /channel:/ {print $2; exit}' concierge-k8s.yaml)"
      if [[ -z $K8S_CHANNEL ]]
      then
        echo "could not read the k8s channel from concierge-k8s.yaml" >&2
        exit 1
      fi
      snap install k8s --classic --channel="$K8S_CHANNEL"

      # The pre-init check refuses to bootstrap while Docker's /run/containerd exists;
      # concierge does the same cleanup before its own bootstrap
      systemctl stop containerd.service || true
      rm -rf /run/containerd

      # `k8s bootstrap --file` REPLACES the default cluster-config rather than merging, so
      # the features a plain bootstrap enables must be spelled out; printf because a heredoc
      # would carry the block scalar's indentation into the file
      printf '%s\n' \
        'cluster-config:' \
        '  network: {enabled: true}' \
        '  dns: {enabled: true}' \
        '  local-storage: {enabled: true}' \
        '  gateway: {enabled: true}' \
        '  metrics-server: {enabled: true}' \
        '  load-balancer:' \
        '    enabled: true' \
        "    cidrs: [$LB_RANGE]" \
        '    l2-mode: true' \
        "pod-cidr: $POD_CIDR" \
        > /tmp/k8s-bootstrap-config.yaml
      k8s bootstrap --timeout 5m --file /tmp/k8s-bootstrap-config.yaml
    fi

    concierge prepare --trace -c concierge-k8s.yaml

    # k8s status --wait-ready returns as soon as 1 node is ready
    # (see https://github.com/canonical/k8s-snap/issues/1789)
    # but Cilium, CoreDNS, and storage may still be initialising
    for res in deployment/cilium-operator deployment/coredns deployment/metrics-server daemonset/cilium daemonset/ck-storage-rawfile-csi-node statefulset/ck-storage-rawfile-csi-controller; do
        if k8s kubectl -n kube-system get "$res" >/dev/null 2>&1; then
            k8s kubectl -n kube-system rollout status "$res" --timeout=5m
        else
            echo "Skipping rollout status for missing $res"
        fi
        done
  fi

  pipx install tox poetry
prepare-each: |
  cd "$SPREAD_PATH"
  # `concierge prepare` needs to be run for each spread job in case Juju version changed
  if [[ $SPREAD_SUITE == *"vm"* ]]
  then
    concierge prepare --trace -c concierge-vm.yaml
  fi

  if [[ $SPREAD_SUITE == *"k8s"* ]]
  then
    concierge prepare --trace -c concierge-k8s.yaml
  fi

  # Unable to set constraint on all models because of Juju bug:
  # https://bugs.launchpad.net/juju/+bug/2065050
  juju set-model-constraints arch="$(dpkg --print-architecture)"
