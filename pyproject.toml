[tool.poetry]
package-mode = false
requires-poetry = ">=2.0.0"

[tool.poetry.dependencies]
python = "^3.12"                                      # switch to 3.14 once charm base is 26.04
ops = "^3.5.0"
charmlibs-pathops = "^1.2.0"
charmlibs-snap = "^1.0.1"
charmlibs-interfaces-tls-certificates = ">=1.6.0"
charmlibs-interfaces-certificate-transfer = ">=1.0.0"
tenacity = "*"
data-platform-helpers = ">=0.1.7"
validators = ">=0.35.0"
dpcharmlibs-interfaces = ">=1.0.2"
lightkube = ">=0.19.0"
valkey = "^6.1.1"
ldap3 = ">=2.9.1"
boto3 = "^1.40"
mypy-boto3-s3 = "^1.40"
object-storage-charmlib = "^1.0.0"
# >=12.15 for StorageStreamDownloader.read(), which the restore path streams through
azure-storage-blob = "^12.19"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.group.charm-libs.dependencies]
# data_platform_libs/v0/data_interfaces.py
ops = ">=2.0.0"

[tool.poetry.group.format]
optional = true

[tool.poetry.group.format.dependencies]
ruff = "*"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = "*"
codespell = "*"
shellcheck-py = "*"

[tool.poetry.group.unit.dependencies]
pytest = "*"
pytest-asyncio = "*"
pytest-mock = "*"
coverage = { extras = ["toml"], version = "*" }
parameterized = "*"
ops-scenario = "*"

[tool.poetry.group.static]
optional = true

[tool.poetry.group.static.dependencies]
pyright = "*"

[tool.poetry.group.integration.dependencies]
pytest = "*"
pytest-asyncio = "*"
allure-pytest = "*"
allure-pytest-default-results = "^0.1.2"
charmlibs-interfaces-tls-certificates = ">=1.6.0"
data-platform-helpers = ">=0.1.7"
jubilant = "^1.6.0"
python-dateutil = "*"
tenacity = "^9.1.2"
valkey-glide = "^2.5"
kubernetes = "^35.0.0"
boto3 = "^1.40"
mypy-boto3-s3 = "^1.40"
azure-storage-blob = "^12.19"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
log_cli_date_format = "%Y-%m-%dT%H:%M:%SZ"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Linting tools configuration
[tool.ruff]
line-length = 99
lint.select = ["E", "W", "F", "C", "N", "D", "I001"]
lint.extend-ignore = [
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
lint.ignore = ["E501", "D107"]
extend-exclude = [
    "__pycache__",
    "*.egg_info",
    "tests/integration/clients/requirer-charm/lib/charms/**",
]
lint.per-file-ignores = { "tests/*" = ["D100", "D101", "D102", "D103", "D104"] }

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.codespell]
skip = "build,lib,venv,icon.svg,.tox,.git,.mypy_cache,.ruff_cache,.coverage"

[tool.pyright]
include = ["src/**/*.py", "lib/**/*.py"]
