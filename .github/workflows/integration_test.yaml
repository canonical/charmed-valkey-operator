on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: |
          Prefix for charm package GitHub artifact(s)

          Use canonical/data-platform-workflows build_charm.yaml to build the charm(s)
        required: true
        type: string
      path-to-charm-directory:
        description: Relative path to charm directory from repository directory
        default: .
        type: string

jobs:
  collect-integration-tests:
    name: Collect spread jobs | ${{ inputs.path-to-charm-directory }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up environment
        run: |
          # snapd intermittently cannot reach the store on a fresh runner
          retry() {
            for attempt in 1 2 3
            do
              "$@" && return 0
              echo "::warning::'$*' failed (attempt $attempt of 3); retrying in 15s"
              sleep 15
            done
            return 1
          }
          retry sudo snap install charmcraft --classic
          retry sudo snap install go --classic
          go install github.com/canonical/spread/cmd/spread@latest
          pipx install tox poetry
      - name: Collect spread jobs
        id: collect-jobs
        shell: python
        run: |
          import json
          import os
          import pathlib
          import subprocess

          spread_jobs = (
              subprocess.run(
                  [pathlib.Path.home() / "go/bin/spread", "-list", "github-ci"],
                  capture_output=True,
                  check=True,
                  text=True,
              )
              .stdout.strip()
              .split("\n")
          )
          jobs = []
          for job in spread_jobs:
              # Example `job`: "github-ci:ubuntu-24.04:tests/spread/test_charm.py:juju36"
              _, runner, task = job.split(":")
              # Example: "test_charm.py"
              task = task.removeprefix("tests/spread/")
              if runner.endswith("-arm"):
                  architecture = "arm64"
              else:
                  architecture = "amd64"
              # Example: "test_charm.py:juju36 | amd64"
              name = f"{task} | {architecture}"
              # ":" character not valid in GitHub Actions artifact
              name_in_artifact = f"{task.replace('/', '-')}-{architecture}"
              jobs.append({
                  "spread_job": job,
                  "name": name,
                  "name_in_artifact": name_in_artifact,
                  "runner": runner,
              })
          output = f"jobs={json.dumps(jobs)}"
          print(output)
          with open(os.environ["GITHUB_OUTPUT"], "a") as file:
              file.write(output)
      - name: Generate Allure default test results
        if: ${{ github.event_name == 'schedule' && github.run_attempt == '1' }}
        run: tox run -e integration -- tests/integration --allure-default-dir=allure-default-results
      - name: Upload Allure default results
        # Default test results in case the integration tests time out or runner set up fails
        # (So that Allure report will show "unknown"/"failed" test result, instead of omitting the test)
        if: ${{ github.event_name == 'schedule' && github.run_attempt == '1' }}
        uses: actions/upload-artifact@v5
        with:
          name: allure-default-results-integration-test
          path: allure-default-results/
          if-no-files-found: error
    outputs:
      jobs: ${{ steps.collect-jobs.outputs.jobs }}

  integration-test:
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.collect-integration-tests.outputs.jobs) }}
    name: ${{ matrix.job.name }}
    needs:
      - collect-integration-tests
    runs-on: ${{ matrix.job.runner }}
    timeout-minutes: 226 # Sum of steps `timeout-minutes` + 5
    steps:
      - name: Disk usage
        timeout-minutes: 5
        run: df --human-readable
      - name: Purge Docker
        # GitHub-hosted Azure runners ship Docker pre-installed and active.
        # Canonical K8s requires "A system with no previous installations
        # of containerd/docker as this may cause conflicts"
        # (see https://documentation.ubuntu.com/canonical-kubernetes
        # /release-1.32/snap/tutorial/getting-started/).
        # Completely purging Docker requires also
        # deleting the Docker-specific `iptables-nft` rulesets
        # created on installation.
        timeout-minutes: 5
        run: |
          sudo apt-get remove --purge -y docker-ce docker-ce-cli containerd.io docker.io containerd 2>/dev/null || true
          sudo nft flush ruleset
          sudo ip link delete docker0 2>/dev/null || true
      - name: Remove podman CNI bridge config
        # Ubuntu 24.04 runners ship podman with a CNI bridge config
        # (/etc/cni/net.d/87-podman-bridge.conflist) that sorts
        # lexicographically before Cilium's config (05-cilium.conflist).
        # When that file is present, containerd picks the podman bridge
        # as the active CNI before Cilium is ready, bypassing the
        # node.kubernetes.io/network-unavailable taint and scheduling
        # pods onto the 10.88.0.0/16 bridge instead of the Cilium pod
        # CIDR. Removing the file ensures Cilium is the only CNI plugin
        # from the start.
        timeout-minutes: 1
        run: |
          sudo rm -f /etc/cni/net.d/87-podman-bridge.conflist
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Set up environment
        # leaves room for the retry budget below on top of the ~3 min this step takes
        timeout-minutes: 8
        run: |
          # snapd intermittently cannot reach the store on a fresh runner
          retry() {
            for attempt in 1 2 3
            do
              "$@" && return 0
              echo "::warning::'$*' failed (attempt $attempt of 3); retrying in 15s"
              sleep 15
            done
            return 1
          }
          retry sudo snap install charmcraft --classic
          retry sudo snap install go --classic
          go install github.com/canonical/spread/cmd/spread@latest
      - name: Download packed charm(s)
        timeout-minutes: 5
        uses: actions/download-artifact@v6
        with:
          pattern: ${{ inputs.artifact-prefix }}-*
          merge-multiple: true
      - name: Run spread job
        timeout-minutes: 75
        id: spread
        run: ~/go/bin/spread -vv -artifacts=artifacts '${{ matrix.job.spread_job }}'
      - name: Upload Allure results
        timeout-minutes: 3
        # Only upload results from one spread system & one spread variant
        # Allure can only process one result per pytest test ID. If parameterization is done via
        # spread instead of pytest, there will be overlapping pytest test IDs.
        if: ${{ (success() || (failure() && steps.spread.outcome == 'failure')) && startsWith(matrix.job.spread_job, 'github-ci:ubuntu-24.04:') && endsWith(matrix.job.spread_job, ':juju36') && github.event_name == 'schedule' && github.run_attempt == '1' }}
        uses: actions/upload-artifact@v5
        with:
          name: allure-results-integration-test-${{ matrix.job.name_in_artifact }}
          path: artifacts/${{ matrix.job.spread_job }}/allure-results/
          if-no-files-found: error
      - timeout-minutes: 1
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        run: snap list
      - name: Select model
        timeout-minutes: 1
        # `!contains(matrix.job.spread_job, 'juju29')` workaround for juju 2 error:
        # "ERROR cannot acquire lock file to read controller concierge-microk8s: unable to open
        # /tmp/juju-store-lock-3635383939333230: permission denied"
        # Unable to workaround error with `sudo rm /tmp/juju-*`
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        id: juju-switch
        run: |
          # sudo needed since spread runs scripts as root
          # "testing" is default model created by concierge
          sudo juju switch testing
          mkdir ~/logs/
      - name: juju status
        timeout-minutes: 1
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        run: sudo juju status --color --relations | tee ~/logs/juju-status.txt
      - name: juju debug-log
        timeout-minutes: 3
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        run: sudo juju debug-log --color --replay --no-tail | tee ~/logs/juju-debug-log.txt
      - name: jhack tail
        timeout-minutes: 3
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        run: script -q -c 'sudo jhack tail --printer raw --replay --no-watch' /dev/null | tee ~/logs/jhack-tail.txt || true
      - name: Capture Valkey server logs
        timeout-minutes: 3
        # Valkey and Sentinel log to files (config.py sets `logfile`), not stdout/journald,
        # so `pebble logs` / `snap logs` miss them; read the files directly and keep a
        # separate service-lifecycle capture. Best-effort -- never fail the job.
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        env:
          SPREAD_JOB: ${{ matrix.job.spread_job }}
        run: |
          set +e
          units=$(sudo juju status --format json 2>/dev/null | python3 -c \
            "import json,sys; d=json.load(sys.stdin); print('\n'.join((d.get('applications',{}).get('valkey',{}).get('units') or {}).keys()))")
          if [[ "$SPREAD_JOB" == *:tests/spread/k8s/* ]]; then
            log_dir=/var/log/valkey
            for unit in $units; do
              pod=${unit/\//-}  # valkey/0 -> valkey-0
              { sudo k8s kubectl -n testing exec "$pod" -c valkey -- \
                cat "$log_dir/valkey.log"; } > ~/logs/"$pod"-valkey-server.txt 2>&1
              { sudo k8s kubectl -n testing exec "$pod" -c valkey -- \
                cat "$log_dir/sentinel.log"; } > ~/logs/"$pod"-valkey-sentinel.txt 2>&1
              { sudo k8s kubectl -n testing exec "$pod" -c valkey -- \
                pebble changes; } > ~/logs/"$pod"-valkey-service.txt 2>&1
            done
          else
            log_dir=/var/snap/valkey-charmed/common/var/log/valkey
            for unit in $units; do
              name=${unit/\//-}
              { sudo juju ssh "$unit" "sudo cat $log_dir/valkey.log"; } \
                > ~/logs/"$name"-valkey-server.txt 2>&1
              { sudo juju ssh "$unit" "sudo cat $log_dir/sentinel.log"; } \
                > ~/logs/"$name"-valkey-sentinel.txt 2>&1
              { sudo juju ssh "$unit" 'sudo snap logs valkey-charmed -n 500'; } \
                > ~/logs/"$name"-valkey-service.txt 2>&1
            done
          fi
          true
      - name: Upload logs
        timeout-minutes: 5
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        uses: actions/upload-artifact@v5
        with:
          name: logs-integration-test-${{ matrix.job.name_in_artifact }}
          path: ~/logs/
          if-no-files-found: error
      - name: Disk usage
        timeout-minutes: 1
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        run: df --human-readable
