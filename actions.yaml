status-detail:
  description: Gets statuses of the charm
  params:
    recompute:
      type: boolean
      default: false
      description: a boolean indicating whether a unit should recompute all statuses.

sync-ldap-users:
  description: Synchronize users from related LDAP provider to Valkey's ACL file.

create-backup:
  description: |
    Stream a fresh RDB backup of this unit's Valkey instance to the related backup storage.
    Runs on the targeted unit (any unit, leader or follower).
    Credentials are taken from the related storage integrator charm.

list-backups:
  description: |
    List all backup objects in the configured backup storage, newest first.
    Safe to run while another backup is uploading.
  params:
    output:
      type: string
      default: table
      description: Output format of the backup list, either "table" or "json".

restore:
  description: |
    Restore the cluster's dataset from a backup in the related backup storage.
    Replaces the data on all units.
    Run on the leader unit. The backup-id must be one returned by list-backups.
    Credentials are taken from the related storage integrator charm.
  params:
    backup-id:
      type: string
      description: The backup-id to restore, in the format produced by list-backups (YYYY-MM-DDTHH:MM:SSZ).
